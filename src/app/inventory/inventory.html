<main>

    <errorBar [errorText]="errorText()"></errorBar>

    <div class="container">


        <section class="sectionA">

            <h1>Staff</h1>

            

                @if (StaffList().length === 0) {
                    <h3>No Staff</h3>
                } @else {
                    @for (staff of StaffList(); track $index) {
                    <div class="span">
                        <p>Name: {{staff.name}}</p>
                        <p>Department: {{staff.role}}</p>
                        <p>Employee ID: {{staff.emp_id}}</p>

                        <button type="button" class="Dbtn" (click)="removeStaff(staff.E_id)">Delete</button>
                    </div>
                } 
            }

        </section>
        
        <section class="sectionB">
            <h1>new Employee</h1>

            <form (ngSubmit)="addEmployee()">
                <label>Name</label>
                <input type="text" name="name" required placeholder="Employee name:" [(ngModel)]="Staff.name">

                <label>Department</label>
                <input type="text" name="role" required placeholder="Employee department" [(ngModel)]="Staff.role">

                <span>Only employee must enter the password</span>
                <label>Password</label>
                <input type="password" name="password" required placeholder="Employee secret password" [(ngModel)]="Staff.password">

                <button type="submit" class="Sbtn">Submit</button>

            </form>

        </section>

    </div>

</main>
