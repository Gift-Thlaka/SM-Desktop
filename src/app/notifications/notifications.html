<main>

    <section>

        <errorBar [errorText]="errorText()"></errorBar>
            @if (notificationList().length === 0) {
                <h3>No notifications yet.</h3>
            } @else {
                @for (item of notificationList(); track item.id) {
                    <div class="item">
                        <strong>{{item.name}}</strong>
                        <p>{{item.instruction}}</p>
                        <button type="button" (click)="updated(item.id)">Assign to staff</button>
                    </div>

                }
            }

    </section>
</main>
